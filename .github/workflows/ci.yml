# CI cho AI-EOS (T-002, Q-46, Q-47). Mọi bước kiểm tra nằm trong scripts/ci.sh.
# Chưa xác minh: cần remote GitHub và một lần chạy thật (Implementation_Plan §11.3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          # CSDL tạm của job, chỉ nghe trên runner; không dùng mật khẩu nên không có secret.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIEOS_REQUIRE_DB: "1"
      AIEOS_REQUIRE_DOCKER: "1" # kiểm Compose (T-003) bắt buộc chạy ở CI
      AIEOS_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      - name: scripts/ci.sh
        run: scripts/ci.sh
